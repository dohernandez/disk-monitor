name: Signed scanner validation

on:
  workflow_dispatch:

permissions:
  contents: read

# Every step runs a Taskfile task; Task is installed from a pinned, checksum-verified
# download (taskfiles/provision/task.json) because these steps hold the scanner certificate.
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Task (checksum-verified bootstrap)
        run: python3 taskfiles/provision/scripts/install_task.py --dir "$RUNNER_TEMP/bin" --github-path
      - name: Build candidate 1 with the isolated signing identity
        env:
          SCANNER_SIGNING_SHA1: ${{ vars.SCANNER_SIGNING_SHA1 }}
          SCANNER_P12_BASE64: ${{ secrets.SCANNER_P12_BASE64 }}
          SCANNER_P12_PASSWORD: ${{ secrets.SCANNER_P12_PASSWORD }}
          APP_BUILD: '1'
          BUILD_DIR: ${{ runner.temp }}/candidate-1
        run: task build:scanner-release
      - name: Build candidate 2 with the same isolated signing identity
        env:
          SCANNER_SIGNING_SHA1: ${{ vars.SCANNER_SIGNING_SHA1 }}
          SCANNER_P12_BASE64: ${{ secrets.SCANNER_P12_BASE64 }}
          SCANNER_P12_PASSWORD: ${{ secrets.SCANNER_P12_PASSWORD }}
          APP_BUILD: '2'
          BUILD_DIR: ${{ runner.temp }}/candidate-2
        run: task build:scanner-release
      - name: Validate candidates without registration or installation
        run: |
          task build:check -- "$RUNNER_TEMP/candidate-1/Disk Monitor.app"
          task build:check:helper-fixtures -- "$RUNNER_TEMP/candidate-1"
          task release:archive -- "$RUNNER_TEMP/candidate-1/Disk Monitor.app" "$RUNNER_TEMP/candidate-1.zip"
          task build:check -- "$RUNNER_TEMP/candidate-2/Disk Monitor.app"
          task build:check:helper-fixtures -- "$RUNNER_TEMP/candidate-2"
          task release:archive -- "$RUNNER_TEMP/candidate-2/Disk Monitor.app" "$RUNNER_TEMP/candidate-2.zip"
          task build:check:scanner-pair -- "$RUNNER_TEMP/candidate-1/Disk Monitor.app" "$RUNNER_TEMP/candidate-2/Disk Monitor.app"
      - name: Check isolated updater startup (test build of the same source)
        run: |
          task build:app -- --test --build-dir "$RUNNER_TEMP/test-build" --expect-arch "${{ matrix.arch }}"
          task build:check:updater -- "$RUNNER_TEMP/test-build/Disk Monitor.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-validation-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidate-*.zip
          if-no-files-found: error
          retention-days: 7
